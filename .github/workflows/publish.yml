name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    # Ubuntu 26.04 has no setup-python build for Python 3.8.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.8', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check src tests

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release description and tag
        shell: bash
        run: |
          python - <<'PY'
          import json, os, tomllib
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              release = json.load(f)['release']
          if not (release.get('body') or '').strip():
              raise SystemExit('Release description must not be empty')
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          tag = release['tag_name']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} does not match version v{version}')
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/py-for-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
